{% extends "layout.html" %}
{% block content %}
    <h2>Essensplanung</h2>

    <div class="filter-section">
        <h3>Anzahl Tage</h3>
        <div class="filter-group">
            <label for="tage-auswahl">Wie viele Tage möchtest du planen?</label>
            <select id="tage-auswahl" onchange="aktualisiereAnzahlTage()">
                <option value="2">2 Tage</option>
                <option value="3">3 Tage</option>
                <option value="4">4 Tage</option>
                <option value="5" selected >5 Tage</option>
                <option value="6">6 Tage</option>
                <option value="7">7 Tage</option>
            </select>
        </div>


    
<!-- Ergänzung für deine index.html vor dem "Woche planen" Button -->
    <div class="filter-section">
        <h3>Filter für Rezepte</h3>
    
        <div class="filter-group">
            <label>
                <input type="checkbox" id="filter-saisonalitaet">
                Nur saisonale Gerichte bevorzugen
            </label>
        </div>
    
        <div class="filter-group">
            <label for="filter-kochdauer">Maximale Kochdauer (Minuten):</label>
            <select id="filter-kochdauer">
                <option value="">Alle</option>
                <option value="20">Bis 20 Min (schnell)</option>
                <option value="30">Bis 30 Min</option>
                <option value="40">Bis 40 Min</option>
                <option value="60">Bis 60 Min</option>
            </select>
        </div>
    
        <div class="filter-group">
            <label for="filter-monat">Monat für Saisonalität:</label>
            <select id="filter-monat">
                <option value="Januar">Januar</option>
                <option value="Februar">Februar</option>
                <option value="März">März</option>
                <option value="April">April</option>
                <option value="Mai">Mai</option>
                <option value="Juni">Juni</option>
                <option value="Juli">Juli</option>
                <option value="August">August</option>
                <option value="September">September</option>
                <option value="Oktober">Oktober</option>
                <option value="November">November</option>
                <option value="Dezember">Dezember</option>
            </select>
        </div>
    </div>

    <style>
    .filter-section {
        background: #fff0f9;
        padding: 20px;
        margin: 20px 0;
        border-radius: 8px;
        border: 1px solid #995a76;
    }
    .filter-section h3 {
        color: #00524C;
        margin-top: 0;
        border-bottom: 2px solid #995a76;
        padding-bottom: 10px;
    }
    .filter-group {
        margin-bottom: 15px;
    }

    .filter-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #00524C;
    }

    .filter-group select {
        width: 100%;
        padding: 8px;
        border: 1px solid #995a76;
        border-radius: 4px;
        background: white;
    }

    .filter-group select:focus {
        outline: none;
        border-color: #ff6eb4;
        box-shadow: 0 0 5px rgba(255, 110, 180, 0.3);
    }

    .gericht-item {
        background: white;
        border: 1px solid #995a76;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
    }

    .gericht-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }

    .gericht-header strong {
        color: #00524C;
    }

    .saison-indicator {
        font-size: 1.2em;
        cursor: help;
    }

    .gericht-details {
        display: flex;
        gap: 20px;
        margin-bottom: 10px;
        font-size: 0.9em;
        color: #995a76;
    }

    .gericht-aktionen {
        display: flex;
        gap: 10px;
    }

    .gericht-aktionen button {
        background-color: #ff6eb4;
        color: white;
        border: none;
        padding: 8px 12px;
        margin: 0;
        cursor: pointer;
        border-radius: 4px;
    }

    .gericht-aktionen button:hover {
        background: #e55ba0;
    }

    .saison-details-container {
        margin-top: 15px;
        padding: 10px;
        background: #fff0f9;
        border-radius: 4px;
        border-left: 4px solid #00524C;
    }

    .saison-details-container h4 {
        margin-top: 0;
        color: #00524C;
    }

    .saison-details-container ul {
        margin: 10px 0;
    }

    .saison-details-container li {
        margin-bottom: 5px;
        color: #995a76;
    }
    </style>
    <button onclick="ladeGefilterteGerichte()" class="btn-primary">Woche planen (mit Filtern)</button>
    <div id="gerichte"></div>

    <button onclick="generiereEinkaufsliste()">Einkaufsliste generieren</button>
    <button onclick="speichereWoche()">Speichern</button>

    <div id="einkaufsliste"></div>
{% endblock %}

<--button onclick="ladeZufall()">Woche planen</button-->
