{% extends "layout.html" %}
{% block content %}
    <h2>Essensplanung</h2>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }

        h2 {
            color: #00524C;
            border-bottom: 3px solid #ff6eb4;
            padding-bottom: 10px;
        }

        .filter-section {
            background: #fff0f9;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid #995a76;
        }

        .filter-section h3 {
            color: #00524C;
            margin-top: 0;
            border-bottom: 2px solid #995a76;
            padding-bottom: 10px;
        }

        .filter-group {
            margin-bottom: 15px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #00524C;
        }

        .filter-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #995a76;
            border-radius: 4px;
            background: white;
        }

        .filter-group select:focus {
            outline: none;
            border-color: #ff6eb4;
            box-shadow: 0 0 5px rgba(255, 110, 180, 0.3);
        }

        .btn-primary {
            background-color: #ff6eb4;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 10px 5px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
        }

        .btn-primary:hover {
            background: #e55ba0;
        }

        .gericht-item {
            background: white;
            border: 1px solid #995a76;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .gericht-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .gericht-header strong {
            color: #00524C;
        }

        .saison-indicator {
            font-size: 1.2em;
            cursor: help;
        }

        .gericht-details {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 0.9em;
            color: #995a76;
        }

        .gericht-aktionen {
            display: flex;
            gap: 10px;
        }

        .gericht-aktionen button {
            background-color: #ff6eb4;
            color: white;
            border: none;
            padding: 8px 12px;
            margin: 0;
            cursor: pointer;
            border-radius: 4px;
        }

        .gericht-aktionen button:hover {
            background: #e55ba0;
        }

        .saison-details-container {
            margin-top: 15px;
            padding: 10px;
            background: #fff0f9;
            border-radius: 4px;
            border-left: 4px solid #00524C;
        }

        .saison-details-container h4 {
            margin-top: 0;
            color: #00524C;
        }

        .saison-details-container ul {
            margin: 10px 0;
        }

        .saison-details-container li {
            margin-bottom: 5px;
            color: #995a76;
        }

        #gerichte, #einkaufsliste {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border: 1px solid #995a76;
        }

        .button-group {
            margin: 20px 0;
        }
    </style>
    <button onclick="ladeGefilterteGerichte()" class="btn-primary">Woche planen (mit Filtern)</button>
    <div id="gerichte"></div>

    <button onclick="generiereEinkaufsliste()">Einkaufsliste generieren</button>
    <button onclick="speichereWoche()">Speichern</button>

    <div id="einkaufsliste"></div>
{% endblock %}

<--button onclick="ladeZufall()">Woche planen</button-->
